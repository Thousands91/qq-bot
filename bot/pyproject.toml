[tool.poetry]
name = "qq-bot"
version = "1.0.0"
description = "QQ 群机器人 - NoneBot v2 + go-cqhttp"
authors = ["You"]

[tool.poetry.dependencies]
python = "^3.10"
nonebot2 = "2.4.0"
nonebot-adapter-onebot = "2.4.4"
nonebot-plugin-apscheduler = ">=0.4.0"
openai = ">=1.10.0"
aiohttp = ">=3.9.0"
python-dotenv = ">=1.0.0"
pytz = ">=2024.1"
googletrans = "4.0.0-rc1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
