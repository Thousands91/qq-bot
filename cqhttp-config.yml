account:
  uin: 0
  password: ""
  encrypt: false
  status: 0
  protocol: 6
  relogin:
    delay: 3
    interval: 3
    max-times: 0

message:
  post-format: array
  ignore-invalid-cqcode: false
  force-fragment: false
  fix-url: false
  report-self-message: false
  remove-reply-at: false
  extra-reply-data: false
  skip-mime-scan: false

output:
  log-level: info
  log-aging: 15
  log-force-new: true
  debug: false

database:
  leveldb:
    enable: true

heartbeat:
  interval: 5

servers:
  - reverse-ws:
      universal: ws://127.0.0.1:8080/onebot/v11/ws
      reconnect-interval: 3000
      middlewares:
        access-token: ""
        filter: ""
        rate-limit:
          enabled: false
        cache:
          image: 0
          video: 0
          record: 0
          file: 0
